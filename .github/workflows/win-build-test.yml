name: Windows Build Test

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-build-sign:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download uv binaries for Windows
        run: pnpm run uv:download:win

      - name: Download agent-browser binaries for Windows
        run: pnpm run agent-browser:download:win

      # Sign inside electron-builder, before blockmaps and update manifests.
      # Every Windows channel (including alpha/beta) uses the same publisher.
      - name: Setup Java for Windows signing
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install eSigner CodeSignTool
        shell: pwsh
        run: ./scripts/setup-windows-signing.ps1

      - name: Build signed Windows
        shell: bash
        env:
          CLAWX_WINDOWS_SIGNING: '1'
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          node scripts/windows-signing.cjs --check
          pnpm run package:win

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-win-exe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            !release/builder-debug.yml
          if-no-files-found: error
          retention-days: 7
